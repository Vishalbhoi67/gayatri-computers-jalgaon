<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your computer repair query status or dispatch docket number at Gayatri Computers Jalgaon.">
  <title>Track Query & Repair Status | Gayatri Computers</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="assets/Logo.jpeg">

  <!-- Firebase 9.23.0 Compat SDK & Firestore Storage Adapter -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar">
      <nav class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Products</a>
        <a href="services.html" class="nav-link">Services</a>
        <a href="track.html" class="nav-link active">Track Query / Order</a>
        <a href="contact.html" class="nav-link">Contact Us</a>
      </nav>

      <div class="nav-actions">
        <a href="admin.html" class="admin-btn">
          <i class="fas fa-user-shield"></i> Admin Login
        </a>
        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Tracker Section -->
  <section class="section-padding track-main-section" style="padding-top: 100px;">
    <div class="container" style="max-width: 800px;">
      
      <!-- Search Input Card -->
      <div class="tracking-card search-box-container" style="margin-bottom: 2.5rem;">
        <form id="trackSearchForm" class="track-search-box" style="margin-bottom: 0;">
          <input type="text" id="trackInput" class="form-control" placeholder="Enter Inquiry Ref (REQ-XXXX), Service Query ID (GC-SRV-XXXX), or Mobile Phone..." style="padding: 0.9rem 1.25rem; font-size: 1.05rem;" required />
          <button type="submit" class="btn btn-primary" style="padding: 0.9rem 1.75rem; font-size: 1.05rem;">
            <i class="fas fa-search"></i> Track Status
          </button>
        </form>
      </div>

      <!-- Results Display Container -->
      <div id="trackResultArea">
        <!-- Results rendered dynamically by js/track.js -->
        <div class="text-center" style="padding: 3rem; color: var(--text-secondary);">
          <i class="fas fa-search-location fa-3x" style="color: var(--text-light); margin-bottom: 1rem;"></i>
          <p>Please enter your Query ID or Mobile Number above to load tracking timeline.</p>
        </div>
      </div>

    </div>
  </section>

  <!-- Scripts -->
  <script src="js/seed-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/track.js"></script>
</body>
</html>
